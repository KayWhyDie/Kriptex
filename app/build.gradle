apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// Realm's Gradle plugin expects a configuration named 'kapt' when Kotlin is applied.
// We intentionally avoid applying the kotlin-kapt plugin here because this project uses
// a Gradle 9 milestone wrapper, and kotlin-kapt currently fails to create tasks under it.
configurations {
    kapt
    kaptTest
    kaptAndroidTest
}

apply plugin: 'realm-android'
apply plugin: 'com.mikepenz.aboutlibraries.plugin'

android {
    namespace = 'com.ivor.kriptex'
    compileSdk 34

    buildFeatures {
        buildConfig = true
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    defaultConfig {
        applicationId "com.ivor.kriptex"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    vectorDrawables.useSupportLibrary = true
    multiDexEnabled = true
    }

    // Ensure Gradle uses an NDK r27+ installed in the SDK so native builds can target
    // 16KB page sizes (required for Android 15+ compatibility).
    // Update this string if you install a different r27+ exact folder name under $ANDROID_SDK_ROOT/ndk
    ndkVersion "27.0.12077973"

    applicationVariants.all { variant ->
        variant.outputs.all {
            def flavor = variant.name
            def versionName = variant.versionName
            outputFileName = "Kriptex_${flavor}_${versionName}_${versionCode}.apk"
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('cpp/CMakeLists.txt')
        }
    }

    packagingOptions.jniLibs {
        useLegacyPackaging = true
        keepDebugSymbols += ['**/libctor.so']
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    androidResources {
        noCompress 'so'
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['core-1.52.0.0.jar', 'prov-1.52.0.0.jar'])
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'

    // Jetpack Compose (UI-only; app logic stays as-is)
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    // Remove legacy-support-v4, use AndroidX alternatives if needed
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // implementation 'com.theartofdev.edmodo:android-image-cropper:2.7.0' // Failing
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    // implementation 'jp.wasabeef:glide-transformations:4.1.0' // Failing
    implementation 'cn.dreamtobe.filedownloader:filedownloader-okhttp3-connection:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.4.0'
    implementation 'com.liulishuo.filedownloader:library:1.7.7'
    implementation 'commons-codec:commons-codec:1.11'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // implementation 'io.realm:android-adapters:3.1.0' // Failing
    // implementation 'com.devlomi.record-view:record-view:2.0.1' // Failing
    // implementation 'com.4ert:audioview:1.4.12' // Failing
    implementation 'com.github.abdularis:androidbuttonprogress:1.0.2'
    // implementation 'com.adityak:browsemyfiles:1.9' // Failing
    implementation 'com.github.MasayukiSuda:Mp4Composer-android:v0.3.9'
    // implementation 'com.github.stfalcon:stfalcon-imageviewer:1.0.1' // Failing
    implementation 'com.google.android.exoplayer:exoplayer:2.18.7'
    // implementation 'com.jarvanmo:exoplayerview:2.1.5' // Failing
    // implementation 'com.github.novoda:merlin:2.0.0'
    implementation "com.mikepenz:aboutlibraries:11.1.0"

    testImplementation 'junit:junit:4.13.2'
}
